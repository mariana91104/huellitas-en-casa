# Server Block de Nginx para "Huellitas en Casa"
# Ruta simulada: http://localhost/tuapp/
# Copiar a /etc/nginx/sites-available/tuapp y enlazar en sites-enabled.

server {
    # Puerto de escucha
    listen 80;
    server_name localhost;

    # Compresión de texto para acelerar la carga
    gzip on;
    gzip_types text/css application/javascript;

    # Redirige /tuapp a /tuapp/ (con diagonal final)
    location = /tuapp {
        return 301 /tuapp/;
    }

    # Mapeo de directorio: URL /tuapp/  ->  carpeta /var/www/tuapp/
    location /tuapp/ {
        alias /var/www/tuapp/;
        index index.html;
        try_files $uri $uri/ =404;
        expires 7d;
    }

    access_log /var/log/nginx/tuapp.access.log;
    error_log  /var/log/nginx/tuapp.error.log;
}
